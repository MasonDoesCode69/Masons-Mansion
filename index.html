<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mason's Mansion | Elite Unblocked 2026</title>
    
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet">

    <style>
        :root {
            --primary: #00f2ff;
            --accent: #bc13fe;
            --bg: #020205;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% 50%, #0a0a12 0%, #020205 100%);
        }

        /* Loading Screen */
        #entryGate {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }

        .neon-glow {
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary);
        }

        .mansion-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .mansion-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.15);
        }

        #physicsCanvas {
            width: 100%;
            height: 500px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: #050508;
        }

        .btn-mansion {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border: none;
            color: #000;
            font-weight: 700;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-mansion:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 20px var(--primary);
        }

        /* Grid Layout */
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
    </style>
</head>
<body onload="initMansion()">

<div id="entryGate">
    <h1 class="neon-glow" style="font-size: 3rem;">AUTHENTICATING...</h1>
    <button class="btn-mansion" onclick="enterMansion()">ACCESS VAULT</button>
</div>

<nav style="padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
    <div class="neon-glow" style="font-weight: bold; font-size: 1.5rem;">MASON'S MANSION</div>
    <button class="btn-mansion" onclick="triggerLogin()" style="padding: 8px 20px;">DEV LOGIN</button>
</nav>

<div class="container" id="mainContent" style="opacity: 0; transition: 1s;">
    <header style="text-align: center; margin-bottom: 4rem;">
        <h1 style="font-size: 4rem; margin-bottom: 0;">Elite <span class="neon-glow">Unblocked</span></h1>
        <p style="opacity: 0.6;">Secure, Fast, and Optimized for 2026 Networks.</p>
    </header>

    <div class="grid">
        <!-- Game Cards -->
        <div class="mansion-card">
            <h3>Cool Math Games</h3>
            <p>High-logic puzzles for elite thinkers.</p>
            <a href="https://www.coolmathgames.com" target="_blank"><button class="btn-mansion">LAUNCH</button></a>
        </div>
        <div class="mansion-card">
            <h3>Subway Surfers</h3>
            <p>HTML5 optimized runner.</p>
            <button class="btn-mansion">LAUNCH</button>
        </div>
        <div class="mansion-card">
            <h3>Dev Tools</h3>
            <p>Bypass scripts and proxy links.</p>
            <button class="btn-mansion">BROWSE</button>
        </div>
    </div>

    <!-- Physics Section -->
    <div style="margin-top: 5rem;">
        <h2 class="neon-glow">Matter Playground</h2>
        <div id="physicsCanvas"></div>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button class="btn-mansion" onclick="addShape()">ADD BOX</button>
            <button class="btn-mansion" onclick="resetPhysics()">RESET</button>
        </div>
    </div>
</div>

<script>
    // Physics Engine Core
    let engine, render, runner;
    const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint } = Matter;

    function initPhysics() {
        engine = Engine.create();
        render = Render.create({
            element: document.getElementById('physicsCanvas'),
            engine: engine,
            options: {
                width: document.getElementById('physicsCanvas').offsetWidth,
                height: 500,
                wireframes: false,
                background: 'transparent'
            }
        });

        const ground = Bodies.rectangle(400, 490, 1600, 60, { isStatic: true, render: { fillStyle: '#bc13fe' } });
        const leftWall = Bodies.rectangle(0, 250, 60, 500, { isStatic: true });
        const rightWall = Bodies.rectangle(1200, 250, 60, 500, { isStatic: true });

        Composite.add(engine.world, [ground, leftWall, rightWall]);

        // Interactivity
        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: { stiffness: 0.2, render: { visible: false } }
        });

        Composite.add(engine.world, mouseConstraint);
        Render.run(render);
        runner = Runner.create();
        Runner.run(runner, engine);
    }

    function addShape() {
        const box = Bodies.rectangle(Math.random() * 400 + 100, 0, 50, 50, {
            render: { fillStyle: '#00f2ff' },
            restitution: 0.8
        });
        Composite.add(engine.world, box);
    }

    function enterMansion() {
        document.getElementById('entryGate').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('entryGate').style.display = 'none';
            document.getElementById('mainContent').style.opacity = '1';
            initPhysics();
        }, 800);
    }

    function triggerLogin() {
        const pass = prompt("Enter Mansion Security Key:");
        if(pass === "mason2026") {
            alert("Welcome, Architect.");
            document.body.style.border = "5px solid var(--accent)";
        } else {
            alert("Access Denied.");
        }
    }
</script>
</body>
</html>
